services:
  android-ip-camera-server:
    # https://github.com/DigitallyRefined/android-ip-camera/releases
    image: ghcr.io/digitallyrefined/android-ip-camera-server:0.17.0
    container_name: android-ip-camera-server
    restart: unless-stopped
    volumes:
      - ./data/relay:/data
    environment:
      # Public HTTPS origin used in the androidipcamera:// pairing link.
      - PUBLIC_URL=${PUBLIC_URL:-https://android-ip-camera-relay.example.com}
      # Werift binds inside this fixed UDP range; publish the same range below.
      - WEBRTC_UDP_PORT_RANGE=40000-40100
      # Address viewers use for the WebRTC UDP candidates. Leave unset to use
      # the private address PUBLIC_URL resolves to, or set it when the relay is
      # behind Docker/NAT and the public hostname points at a proxy.
      - WEBRTC_ADVERTISE_HOST=${WEBRTC_ADVERTISE_HOST:-}
      # Add a TURN server here if viewers and the relay are behind symmetric NAT.
      - WEBRTC_STUN_URLS=stun:stun.l.google.com:19302
      # Internal address of the Apprise API used for notifications.
      - APPRISE_URL=${APPRISE_URL:-http://apprise:8000}
    env_file:
      - ./.env
    # WebRTC media is UDP and cannot go through Traefik's HTTP router.
    ports:
      - "40000-40100:40000-40100/udp"
    # Disable Core Dumps
    ulimits:
      core:
        soft: 0
        hard: 0
    build:
      context: .
      target: production
    depends_on:
      apprise:
        condition: service_healthy
    networks:
      - traefik
      - backend
    labels:
      traefik.enable: true
      # The container is on two networks; tell Traefik which one to route over.
      traefik.docker.network: traefik

      traefik.http.routers.android-ip-camera.entrypoints: websecure
      traefik.http.routers.android-ip-camera.rule: Host(`android-ip-camera-relay.example.com`)
      traefik.http.routers.android-ip-camera.tls: true

  apprise:
    # https://github.com/caronc/apprise/releases
    image: caronc/apprise:2.1.0
    container_name: android-ip-camera-apprise
    restart: unless-stopped
    volumes:
      - ./data/apprise/config:/config
      - ./data/apprise/attach:/attach
    # Not exposed publicly: only the relay reaches it, over the backend network.
    networks:
      - backend
    # Apprise needs outbound internet access to deliver notifications.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  traefik:
    external: true
  backend:
