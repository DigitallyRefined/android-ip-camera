services:
  android-ip-camera-server:
    # https://github.com/DigitallyRefined/android-ip-camera/releases
    image: ghcr.io/digitallyrefined/android-ip-camera-server:0.16.1
    container_name: android-ip-camera-server
    restart: unless-stopped
    volumes:
      - ./storage:/storage
    environment:
      # Persist only device records and pairing codes. Media and proxied
      # requests never touch the disk.
      - DB_PATH=/storage/relay.sqlite
      # Public HTTPS origin used in the androidipcamera:// pairing link.
      - PUBLIC_URL=https://android-ip-camera.example.com
      # Werift binds inside this fixed UDP range; publish the same range below.
      - WEBRTC_UDP_PORT_RANGE=40000-40100
      # Address viewers use for the WebRTC UDP candidates. Leave unset to use
      # the private address PUBLIC_URL resolves to, or set it when the relay is
      # behind Docker/NAT and the public hostname points at a proxy.
      - WEBRTC_ADVERTISE_HOST=${WEBRTC_ADVERTISE_HOST:-}
      # Add a TURN server here if viewers and the relay are behind symmetric NAT.
      - WEBRTC_STUN_URLS=stun:stun.l.google.com:19302
    env_file:
      - ./.env
    # WebRTC media is UDP and cannot go through Traefik's HTTP router.
    ports:
      - "40000-40100:40000-40100/udp"
    # Disable Core Dumps
    ulimits:
      core:
        soft: 0
        hard: 0
    build:
      context: .
      target: production
    networks:
      - traefik
    labels:
      traefik.enable: true

      traefik.http.routers.android-ip-camera.entrypoints: websecure
      traefik.http.routers.android-ip-camera.rule: Host(`android-ip-camera.example.com`)
      traefik.http.routers.android-ip-camera.tls: true

networks:
  traefik:
    external: true
