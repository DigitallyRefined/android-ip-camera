name: Build server and push

on:
  workflow_dispatch:
  # Run once the metadata workflow finishes, so the image is built after the
  # release tag has been moved to the metadata commit.
  workflow_run:
    workflows: ["Generate Fastlane Metadata"]
    types: [completed]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest release tag
        id: get-latest-tag
        run: |
          # The metadata workflow force-updates tags, so refetch them.
          git fetch --tags --force
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v0.0.0")
          echo "tag=$latest_tag" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: 'image=moby/buildkit:v0.10.5'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/digitallyrefined/android-ip-camera-server:latest
            ghcr.io/digitallyrefined/android-ip-camera-server:${{ env.tag }}
