name: Deploy website

# Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
# Optional repository variables:
#   CLOUDFLARE_PAGES_PROJECT  (default: android-ip-camera)
#   DOCUSAURUS_URL            (default: https://ip-cam.app)
#   DOCUSAURUS_BASE_URL       (default: /)
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - website/**
      - fastlane/metadata/android/en-US/images/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DOCUSAURUS_URL || 'https://ip-cam.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build
        env:
          DOCUSAURUS_URL: ${{ vars.DOCUSAURUS_URL || 'https://ip-cam.app' }}
          DOCUSAURUS_BASE_URL: ${{ vars.DOCUSAURUS_BASE_URL || '/' }}
          DOCUSAURUS_ASSETS_DIR: ../fastlane/metadata/android/en-US/images

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy website/build --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'android-ip-camera' }} --branch=main
