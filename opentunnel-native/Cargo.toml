[package]
name = "opentunnel-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "opentunnel_native"
crate-type = ["cdylib"]

[dependencies]
humantime = "2.4"
jni = "0.21.1"
opentunnel = "=0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }
url = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
