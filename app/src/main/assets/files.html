<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recordings</title>
    <style>
      body {
        background: #121212;
        color: #e0e0e0;
        font-family: -apple-system, Roboto, sans-serif;
        margin: 0;
        padding: 16px;
      }

      .breadcrumb {
        max-width: 720px;
        margin: 0 0 12px;
        color: #aaa;
        font-size: 0.92rem;
        line-height: 1.6;
        word-break: break-all;
      }

      .breadcrumb .sep {
        color: #555;
        margin: 0 6px;
      }

      .breadcrumb .current {
        color: #fff;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 720px;
        background: #1e1e1e;
        border-radius: 8px;
        overflow: hidden;
      }

      td,
      th {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid #333;
        font-size: 0.9rem;
      }

      th {
        color: #888;
        font-weight: 500;
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.05em;
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.num {
        white-space: nowrap;
        color: #aaa;
      }

      a {
        color: #007AFF;
        text-decoration: none;
        word-break: break-all;
      }

      a:hover {
        text-decoration: underline;
      }

      a.dir {
        color: #fff;
        font-weight: 600;
      }

      a.dir:hover {
        color: #007AFF;
      }

      button {
        background: #444;
        color: #fff;
        border: 1px solid #666;
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 0.85rem;
      }

      button:hover {
        background: #c0392b;
        border-color: #c0392b;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button:disabled:hover {
        background: #444;
        border-color: #666;
      }

      td.empty {
        color: #888;
        padding: 24px 12px;
      }

      /* Compact layout for the embedded recordings panel and narrow screens. */
      @media (max-width: 600px) {
        body {
          padding: 10px;
        }

        td,
        th {
          padding: 8px 6px;
        }

        th:nth-child(3),
        td:nth-child(3) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb">Loading...</nav>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Size</th>
          <th>Last Modified</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr id="empty">
          <td colspan="4" class="empty">Loading...</td>
        </tr>
      </tbody>
    </table>
    <script>
      const rowsEl = document.getElementById('rows');
      const breadcrumbEl = document.getElementById('breadcrumb');
      let currentDir = '';

      function formatSize(bytes) {
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let size = bytes,
          unit = 0;
        while (size >= 1024 && unit < units.length - 1) {
          size /= 1024;
          unit++;
        }
        return (
          unit === 0
          ? size
          : size.toFixed(1)) + ' ' + units[unit];
      }

      const dateFormat = new Intl.DateTimeFormat(undefined, {
        dateStyle: 'short',
        timeStyle: 'medium'
      });
      function formatDate(ms) {
        return dateFormat.format(ms);
      }

      function joinPath(dir, name) {
        return dir ? dir + '/' + name : name;
      }

      function fileUrl(path) {
        return '/files/' + path.split('/').map(encodeURIComponent).join('/');
      }

      function dirUrl(path) {
        return '?dir=' + encodeURIComponent(path);
      }

      function setStatus(message) {
        rowsEl.textContent = '';
        if (!message)
          return;
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4;
        td.className = 'empty';
        td.textContent = message;
        tr.appendChild(td);
        rowsEl.appendChild(tr);
      }

      function renderBreadcrumb(dir) {
        breadcrumbEl.textContent = '';
        // Paths are shown relative to the recordings root, which is represented by a home icon.
        const root = document.createElement('a');
        root.href = dirUrl('');
        root.className = 'home';
        root.title = 'Recordings root';
        root.setAttribute('aria-label', 'Recordings root');
        root.textContent = '🏠';
        breadcrumbEl.appendChild(root);

        let accumulated = '';
        for (const segment of dir.split('/').filter(Boolean)) {
          accumulated = joinPath(accumulated, segment);
          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = '/';
          const link = document.createElement('a');
          link.href = dirUrl(accumulated);
          link.textContent = segment;
          breadcrumbEl.append(sep, link);
        }
      }

      async function loadFiles(dir) {
        const target = dir || '';
        setStatus('Loading...');
        try {
          const res = await fetch('/files.json?dir=' + encodeURIComponent(target));
          if (!res.ok)
            throw new Error('HTTP ' + res.status);
          const data = await res.json();
          currentDir = data.path || '';
          const suffix = currentDir ? '/' + currentDir : '/';
          document.title = 'Index of ' + suffix;
          renderBreadcrumb(currentDir);
          setStatus(null);

          const entries = Array.isArray(data.entries) ? data.entries : [];
          for (const entry of entries) {
            const tr = document.createElement('tr');

            const nameTd = document.createElement('td');
            const link = document.createElement('a');
            if (entry.isDirectory) {
              link.className = 'dir';
              link.href = dirUrl(joinPath(currentDir, entry.name));
              link.textContent = '📁 ' + entry.name;
            } else {
              link.href = fileUrl(joinPath(currentDir, entry.name));
              link.setAttribute('download', '');
              link.textContent = entry.name;
            }
            nameTd.appendChild(link);

            const sizeTd = document.createElement('td');
            sizeTd.className = 'num';
            sizeTd.textContent = entry.isDirectory ? '—' : formatSize(entry.sizeBytes);

            const dateTd = document.createElement('td');
            dateTd.textContent = formatDate(entry.lastModifiedMs);

            const delTd = document.createElement('td');
            const btn = document.createElement('button');
            btn.dataset.path = joinPath(currentDir, entry.name);
            btn.dataset.isDirectory = entry.isDirectory ? '1' : '';
            btn.onclick = () => deleteEntry(btn);
            btn.textContent = 'Delete';
            delTd.appendChild(btn);

            tr.append(nameTd, sizeTd, dateTd, delTd);
            rowsEl.appendChild(tr);
          }
          if (entries.length === 0)
            setStatus(currentDir ? 'This folder is empty.' : 'No files.');
        } catch (e) {
          renderBreadcrumb(target);
          setStatus('Failed to load file list: ' + e.message);
        }
      }

      async function deleteEntry(btn) {
        const path = btn.dataset.path;
        const message = btn.dataset.isDirectory
          ? 'Delete folder "' + path + '" and all of its contents? This cannot be undone.'
          : 'Delete "' + path + '"? This cannot be undone.';
        if (!confirm(message))
          return;
        btn.disabled = true;
        btn.textContent = 'Deleting...';
        try {
          const res = await fetch(fileUrl(path), {method: 'DELETE'});
          if (res.ok) {
            await loadFiles(currentDir);
            return;
          }
          alert('Delete failed (HTTP ' + res.status + ')');
        } catch (e) {
          alert('Delete failed: ' + e);
        }
        btn.disabled = false;
        btn.textContent = 'Delete';
      }

      const initialDir = new URLSearchParams(location.search).get('dir') || '';
      loadFiles(initialDir);
    </script>
  </body>
</html>
