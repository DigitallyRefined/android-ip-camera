plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def skipSigning = project.hasProperty('skipSigning')
def enableAbiSplits = project.properties.getOrDefault('enableAbiSplits', 'true').toBoolean()

def keystorePropertiesFile = rootProject.file("signing.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.github.digitallyrefined.androidipcamera'
    compileSdk 36
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.github.digitallyrefined.androidipcamera"
        minSdk 24
        targetSdk 36
        versionCode 191
        versionName "0.19.1"

        // https://f-droid.org/docs/Reproducible_Builds/#pngs-generated-from-vector-drawables
        vectorDrawables.generatedDensities = []

        // androidx.camera:camera-core ships libimage_processing_util_jni.so for
        // x86 and x86_64 too, while the Rust OpenTunnel library is only built
        // for ARM. Packaging the x86 CameraX library would advertise x86
        // support in the APK/F-Droid listing even though remote access cannot
        // work there, so only package the ABIs the app actually supports.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // https://f-droid.org/docs/Reproducible_Builds/#png-crushcrunch
    aaptOptions {
        cruncherEnabled false
    }

    signingConfigs {
        release {
          if (skipSigning) {
              // Unsigned release builds for reproducible build verification.
          } else if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
              storeFile file(keystoreProperties['storeFile'])
              storePassword keystoreProperties['storePassword']
              keyAlias keystoreProperties['keyAlias']
              keyPassword keystoreProperties['keyPassword']
          } else {
            def isReleaseBuild = gradle.startParameter.taskNames.any { it.contains('Release') }
            def errorMessage = 'Signing configuration is not set up. Please copy signing.properties.default to signing.properties and fill in the values and create the keystore file via Android Studio - Generate Signed App Bundle/APK.'
            if (isReleaseBuild) {
              throw new GradleException(errorMessage)
            } else {
              logger.warn(errorMessage)
            }
          }
      }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            if (!skipSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            crunchPngs false
            // https://f-droid.org/docs/Reproducible_Builds/#vcs-info
            vcsInfo {
                include false
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            splits {
                abi {
                    enable enableAbiSplits
                    reset()
                    include "armeabi-v7a", "arm64-v8a"
                    universalApk true
                }
            }
        }
    }

    sourceSets {
        main {
            // Filled by buildOpenTunnelNative before the APK's JNI folders are merged.
            jniLibs.srcDirs += ["${project.layout.buildDirectory.get().asFile}/rustJniLibs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: "universal"
            def buildType = variant.buildType.name

            def newApkName = "${project.rootProject.name}-${versionName}-${abi}-${buildType}.apk"
            outputFileName = newApkName
        }
    }
}

// https://f-droid.org/docs/Reproducible_Builds/#bug-baselineprof-not-deterministic
tasks.whenTaskAdded { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}

// ---------------------------------------------------------------------------
// Rust OpenTunnel client (JNI, arm64-v8a + armeabi-v7a)
// ---------------------------------------------------------------------------
// Locate the Rust toolchain explicitly instead of trusting PATH. A Gradle daemon
// keeps the environment of whichever process started it, so a daemon that
// predates a rustup install (or was started by an IDE) has no ~/.cargo/bin and
// the cargo task fails with "A problem occurred starting process 'command
// 'cargo''". Resolved at execution time so the configuration cache cannot pin a
// stale result.
def resolveRustBinDir = {
    def candidates = []
    def cargoOverride = System.getenv("CARGO")
    if (cargoOverride) {
        candidates << new File(cargoOverride).absoluteFile.parentFile
    }
    candidates << new File(System.getProperty("user.home"), ".cargo/bin")
    (System.getenv("PATH") ?: "").split(File.pathSeparator).each { entry ->
        if (entry) {
            candidates << new File(entry)
        }
    }
    candidates.find { new File(it, "cargo").canExecute() }
}

def rustApiLevel = 24
def rustCrateDir = rootProject.file("opentunnel-native")
def rustJniDir = project.layout.buildDirectory.dir("rustJniLibs")
def rustTargetDir = project.layout.buildDirectory.dir("rust-target")

def rustAbis = [
    [
        taskSuffix: "Arm64",
        abi: "arm64-v8a",
        rustTarget: "aarch64-linux-android",
        clang: "aarch64-linux-android${rustApiLevel}-clang",
    ],
    [
        taskSuffix: "Armv7",
        abi: "armeabi-v7a",
        rustTarget: "armv7-linux-androideabi",
        clang: "armv7a-linux-androideabi${rustApiLevel}-clang",
    ],
]

def rustTaskNames = []
rustAbis.each { abi ->
    def taskName = "buildOpenTunnelNative${abi.taskSuffix}"
    def rustTarget = abi.rustTarget
    def abiName = abi.abi
    def clangName = abi.clang
    rustTaskNames << taskName

    tasks.register(taskName, Exec) {
        group = "build"
        description = "Builds the Rust OpenTunnel JNI library for Android ${abiName}"
        workingDir rustCrateDir

        // Do not use android.ndkDirectory here: it throws "NDK is not installed"
        // while the project is still being configured. F-Droid installs the NDK
        // from the metadata `ndk:` field, and other builders may not have it
        // until the build actually runs. Deriving the path from the SDK keeps
        // configuration working and lets the task report a useful error.
        def ndkVersion = android.ndkVersion
        def sdkDir = androidComponents.sdkComponents.sdkDirectory.get().asFile
        def ndkDir = new File(sdkDir, "ndk/${ndkVersion}")

        // Keep the local username and checkout path out of the native library.
        // Computed here because doFirst may not reference the rootProject model.
        def userHome = new File(System.getProperty("user.home")).absolutePath
        def cargoHome = new File(System.getenv("CARGO_HOME") ?: new File(userHome, ".cargo").path).absolutePath
        def rustupHome = new File(System.getenv("RUSTUP_HOME") ?: new File(userHome, ".rustup").path).absolutePath
        // Specific prefixes must come last: rustc uses the last matching prefix.
        def rustRemapFlags = [
            "--remap-path-prefix=${userHome}=/home/user",
            "--remap-path-prefix=${rustupHome}=/rustup",
            "--remap-path-prefix=${cargoHome}=/cargo",
            "--remap-path-prefix=${rootProject.projectDir.absolutePath}=/build/${rootProject.name}",
        ]
        if (rustTarget == "aarch64-linux-android") {
            // CARGO_ENCODED_RUSTFLAGS replaces the target rustflags from
            // .cargo/config.toml, so keep the 16 KB page-size link flag.
            rustRemapFlags.addAll(["-C", "link-arg=-Wl,-z,max-page-size=16384"])
        }

        environment "CARGO_TARGET_DIR", rustTargetDir.get().asFile.absolutePath

        commandLine "cargo", "build", "--release", "--locked", "--target", rustTarget

        doFirst {
            if (!ndkDir.isDirectory()) {
                throw new GradleException(
                    "Android NDK ${ndkVersion} is not installed at ${ndkDir}. " +
                    "Install it with sdkmanager, or add 'ndk: ${ndkVersion}' to the " +
                    "F-Droid build metadata."
                )
            }

            // The NDK ships one prebuilt LLVM toolchain per host (darwin-x86_64,
            // linux-x86_64, windows-x86_64). Pick whichever one this machine has.
            def prebuiltParent = new File(ndkDir, "toolchains/llvm/prebuilt")
            def prebuilt = prebuiltParent.listFiles()?.find { it.directory }
            if (prebuilt == null) {
                throw new GradleException("No NDK LLVM toolchain found under ${prebuiltParent}")
            }
            def clang = new File(prebuilt, "bin/${clangName}")
            def ar = new File(prebuilt, "bin/llvm-ar")
            def ranlib = new File(prebuilt, "bin/llvm-ranlib")

            [clang, ar, ranlib].each {
                if (!it.exists()) {
                    throw new GradleException("Missing NDK tool: ${it}")
                }
            }

            environment "CARGO_TARGET_${rustTarget.replace('-', '_').toUpperCase()}_LINKER", clang.absolutePath
            environment "CC_${rustTarget}", clang.absolutePath
            environment "CC_${rustTarget.replace('-', '_')}", clang.absolutePath
            environment "AR_${rustTarget}", ar.absolutePath
            environment "AR_${rustTarget.replace('-', '_')}", ar.absolutePath
            environment "RANLIB_${rustTarget}", ranlib.absolutePath
            environment "RANLIB_${rustTarget.replace('-', '_')}", ranlib.absolutePath

            def encodedRustFlags = System.getenv("CARGO_ENCODED_RUSTFLAGS")
            def allRustFlags = encodedRustFlags ? encodedRustFlags.split("\u001f", -1).toList() : []
            allRustFlags.addAll(rustRemapFlags)
            environment "CARGO_ENCODED_RUSTFLAGS", allRustFlags.join("\u001f")

            def rustBin = resolveRustBinDir()
            if (rustBin == null) {
                throw new GradleException(
                    "Rust toolchain not found. Install it from https://rustup.rs " +
                    "(cargo and rustc must be available in ~/.cargo/bin or on PATH), " +
                    "then re-run the build."
                )
            }
            // cargo shells out to rustc, so the toolchain's bin dir has to come first.
            def ambientPath = System.getenv("PATH") ?: ""
            environment "PATH", "${rustBin}${File.pathSeparator}${ambientPath}"
            executable new File(rustBin, "cargo").absolutePath
        }

        inputs.files(fileTree(rustCrateDir) {
            // .cargo/config.toml carries the linker flags (16 KB page alignment),
            // so a change there has to invalidate the cached build output.
            include "Cargo.toml", "Cargo.lock", "src/**", ".cargo/config.toml"
        })
        inputs.file(rootProject.file("rust-toolchain.toml"))
        inputs.property "rustTarget", rustTarget
        inputs.property "rustApiLevel", rustApiLevel
        inputs.property "ndkVersion", ndkVersion
        outputs.dir(new File(rustJniDir.get().asFile, abiName))

        doLast {
            def source = new File(
                new File(new File(rustTargetDir.get().asFile, rustTarget), "release"),
                "libopentunnel_native.so"
            ).toPath()
            def destinationDir = new File(rustJniDir.get().asFile, abiName).toPath()
            java.nio.file.Files.createDirectories(destinationDir)
            java.nio.file.Files.copy(
                source,
                destinationDir.resolve("libopentunnel_native.so"),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }
    }
}

tasks.register("buildOpenTunnelNative") {
    group = "build"
    description = "Builds the Rust OpenTunnel JNI library for all supported ABIs"
    dependsOn rustTaskNames
}

// Cargo serializes access to its shared target directory; keep the builds ordered.
tasks.named("buildOpenTunnelNativeArmv7").configure {
    mustRunAfter "buildOpenTunnelNativeArm64"
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn "buildOpenTunnelNative"
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Security dependencies
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // CameraX dependencies
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'

    // Coroutines for asynchronous operations
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'

    // BouncyCastle for certificate generation
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json implementation for JVM unit tests (Android only provides stubs).
    testImplementation 'org.json:json:20240303'
}
